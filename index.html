<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="bg-[url('https://i.pinimg.com/736x/f2/eb/7b/f2eb7b93a4b27448bedc2dace9378a13.jpg')] bg-cover bg-center bg-no-repeat cursor-pointer">
    <div id="guessingGame">


        <div class="flex justify-center items-center  mt-20 gap-5">
            <div>
                <div>
                    <h1 class="text-8xl text-center text-purple-700 mb-10 font-bold">
                        {{display.join(" ")}}
                    </h1>
                </div>
                <div v-for="(row, i) in letters " :key="i" class="flex justify-center gap-3 mb-3">
                    <div v-for="letter in row" :key="letter" @click="press(letter)" :class="['border-2 rounded-xl p-5 text-6xl font-bold bg-gray-200 hover:bg-gray-400 text-black cursor-pointer', 
                        usedLetters.includes(letter)
                       ? 'text-blue-500 bg-gray-400 cursor-not-allowed'
                       : 'bg-blue-800 cursor-pointer'
                        
                        
                        ]">
                        {{letter}}
                    </div>

                </div>
                <div class="flex flex-col justify-center items-center">
                    <div
                    
                        class="  font-bold py-2 px-5 m-5 rounded-lg text-2xl  duration-200 text-white cursor-pointer bg-orange-500 hover:bg-orange-700 border-3 border-white">
                        <h1>{{message}}</h1>
                    </div>
                    <div>

                        <button @click="restartGame"
                            class="  font-bold py-2 px-5 rounded-lg text-2xl  duration-200 text-white cursor-pointer bg-red-700 hover:bg-red-900 border-3 border-white">Restart</button>
                    </div>
                </div>

            </div>


        </div>
    </div>
    <script>

        Vue.createApp({
            data() {
                return {
                    letters: [
                        ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
                        ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
                        ["Z", "X", "C", "V", "B", "N", "M"]
                    ],
                    display: [
                        "_", "_", "_", "_", "_"

                    ],
                    words: ["DENNA", "ASHLY", "TATAL", "JUNEL", "SYBIL"],
                    usedLetters: [],
                    randomValue: "",
                    message: '',

                }
            },
            methods: {
                randomWords() {
                    let random = Math.floor(Math.random() * this.words.length);
                    return this.words[random];

                },
                press(letter) {
                    if (this.usedLetters.includes(letter)) return
                    this.usedLetters.push(letter);
                    for (let i = 0; i < this.randomValue.length; i++) {
                        if (this.randomValue[i] === letter) {
                            this.display[i] = letter;
                        }

                    }
                    this.isWinner();
                },
                isWinner() {
                    if (this.display.join("") === this.randomValue) {
                        this.message = 'You Win!'
                    }
                },
                restartGame() {
                    this.usedLetters = [];
                    this.randomValue = '';
                    this.message = '';
                    this.display = ["_", "_", "_", "_", "_"];
                    this.randomValue = this.randomWords();
                    console.log(this.randomValue)


                }
            },
            mounted() {
                this.randomValue = this.randomWords();

            }

        }).mount('#guessingGame')


    </script>













</body>

</html>
